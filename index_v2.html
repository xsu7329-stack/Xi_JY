// 余额显示函数（带千位分隔符）
function updateBalanceDisplay(value) {
    const elem = document.getElementById('balanceNum');
    if (elem) {
        elem.innerHTML = value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '<span class="currency-unit">USDT</span>';
    }
}

// ===================== 核心：真实波动函数 =====================
function randomFluctuation() {
    let rand = Math.random();
    let delta = 0;
    let changeDesc = "";
    
    if (rand < 0.65) {
        // 小波动：几百到几千
        delta = (Math.random() - 0.5) * 5000;
        changeDesc = "小额波动";
    } else if (rand < 0.88) {
        // 中波动：1万到6万
        delta = (Math.random() - 0.5) * 60000;
        changeDesc = "中额波动";
    } else {
        // 大波动：5万到18万
        delta = (Math.random() - 0.5) * 180000;
        changeDesc = "大额波动";
    }
    
    let newVal = currentBalance + delta;
    // 保证余额在合理范围 10万 ~ 300万
    newVal = Math.min(3000000, Math.max(100000, parseFloat(newVal.toFixed(2))));
    
    // 控制台输出波动日志（方便观察）
    console.log(`${changeDesc}: ${delta > 0 ? '+' : ''}${delta.toFixed(2)} USDT → 新余额: ${newVal.toLocaleString()} USDT`);
    
    // 更新显示
    const elem = document.getElementById('balanceNum');
    if (elem) {
        elem.innerHTML = newVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '<span class="currency-unit">USDT</span>';
    }
    currentBalance = newVal;
}

    }
    
    modal.classList.add('show');
    titleEl.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 正在接入西极法殿...';
    textEl.innerText = '查询中，请稍候';
    
    try {
        const response = await fetch(`${API_URL}?uid=${uid}`, {
            method: 'GET',
            headers: { 'Accept': 'application/json' }
        });
        
        const result = await response.json();
        
        if (result.status === "success" && result.data) {
            const d = result.data;
            titleEl.innerHTML = `<span style="color:#FFD966">${d.tag || '合规用户'} · ${uid}</span>`;
            textEl.innerHTML = `💰 可用余额：${d.balance} USDT\n🔒 质押金额：${d.deposit} USDT\n⭐ 信用评级：${d.level}\n📊 信誉分：${d.credit || '85'}`;
        } else {
            titleEl.innerHTML = `<span style="color:#FF3B30">🚨 风险警报</span>`;
            textEl.innerHTML = `<b>UID ${uid}</b>\n\n${result.msg || '该用户未在西极协议备案，请谨慎交易！'}`;
        }
    } catch (error) {
        titleEl.innerHTML = `<span style="color:#FF3B30">⚠️ 连接失败</span>`;
        textEl.innerHTML = `无法连接到西极服务器\n\n请检查：\n1. 服务器IP是否正确\n2. 8000端口是否开放\n3. 后端服务是否运行\n\n当前配置IP: ${SERVER_IP}`;
    }
}

// Tab切换
function switchTab(tab) {
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
    
    if (tab === 'home') {
        document.querySelectorAll('.balance-card, .search-box, .section-title, .grid-8, .two-columns, .service-bar, .quick-rules').forEach(el => {
            if (el) el.style.display = '';
        });
    } else if (tab === 'orders') {
        document.querySelectorAll('.balance-card, .search-box, .section-title, .grid-8, .service-bar, .quick-rules').forEach(el => {
            if (el) el.style.display = 'none';
        });
        document.querySelector('.two-columns').style.display = 'flex';
        const orderPanel = document.getElementById('orderList');
        if (orderPanel) {
            orderPanel.innerHTML = ordersData.map(o => `
                <div class="order-item">
                    <div class="order-title">${o.title} ${o.amount}</div>
                    <div class="order-badge ${o.type === 'penalty' ? 'badge-penalty' : 'badge-success'}">${o.status}</div>
                </div>
            `).join('');
        }
    } else if (tab === 'law') {
        document.querySelectorAll('.balance-card, .search-box, .section-title, .grid-8, .two-columns, .quick-rules').forEach(el => {
            if (el) el.style.display = 'none';
        });
        document.querySelector('.service-bar').style.display = 'flex';
    }
}

// 事件绑定
function bindEvents() {
    document.getElementById('searchBtn').addEventListener('click', searchUser);
    document.getElementById('closeModal').addEventListener('click', () => {
        document.getElementById('ruleModal').classList.remove('show');
    });
    document.getElementById('ruleModal').addEventListener('click', (e) => {
        if (e.target.classList.contains('modal')) document.getElementById('ruleModal').classList.remove('show');
    });
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
    });
    document.getElementById('searchUid').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchUser();
    });
}

// 初始化
function init() {
    renderCategories();
    renderNews();
    renderOrders();
    initMarquee();
    bindEvents();
    updateBalanceDisplay(currentBalance);
    document.getElementById('uidSpan').innerText = "7780788725";
    switchTab('home');
    
    // 启动余额波动，每8秒变化一次
    setInterval(randomFluctuation, 8000);
    
    console.log("✅ 西极协议前端已启动 | 余额真实波动模式已开启");
    console.log(`📡 API地址: ${API_URL}`);
}

init();
</script>
